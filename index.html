<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<script>
(function(){var t=null;try{t=localStorage.getItem('mayl-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t='light'}
document.documentElement.setAttribute('data-theme',t);
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#1C1720':'#F7F4EE';})();
</script>
<title>مَيل — نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EE; --surface:#FFFEFB; --ink:#2F2438; --muted:#716674;
  --honey:#F5C75B; --lavender:#DCD1EF; --peach:#F2B6A0; --sage:#DDE8D2;
  --highlight:#FFF0AA; --border:#E8E0D9;
  /* درجات مساندة مشتقة من اللوحة */
  --honey-soft:#FBE8B6; --lav-soft:#EFEAF8; --peach-soft:#FADFD4; --sage-soft:#EDF3E8;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:14px;
  --shadow:0 1px 2px rgba(47,36,56,.04),0 10px 28px -16px rgba(47,36,56,.22);
  --shadow-lift:0 2px 4px rgba(47,36,56,.06),0 18px 40px -18px rgba(47,36,56,.32);
  --font:'Tajawal',system-ui,-apple-system,'Segoe UI','Noto Sans Arabic','Geeza Pro',Tahoma,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --nav-h:70px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--paper);scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.6;font-size:16px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
@supports (overflow:clip){body{overflow-x:clip}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea,select{font:inherit;color:inherit}
img,svg{display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.ic{flex:none}

/* ===== الهيكل ===== */
.app{max-width:1120px;margin:0 auto;padding:calc(var(--safe-t) + 6px) 18px calc(var(--nav-h) + 44px + var(--safe-b))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;border:0;background:none;padding:4px 0}
.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--honey);display:grid;place-items:center}
.top-actions{display:flex;gap:8px;align-items:center}
.pill-sm{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink)}
.subbar{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;align-items:center;gap:10px;min-height:60px;margin:0 -18px;padding:calc(var(--safe-t) + 4px) 18px 4px;border-bottom:1px solid transparent}
.subbar.scrolled{border-bottom-color:var(--border)}
.subbar .title{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;padding:0}
.view{animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section{margin-top:30px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:19px;font-weight:800}
.link{border:0;background:none;padding:6px 2px;font-weight:700;font-size:14px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--honey);text-decoration-thickness:3px;text-underline-offset:5px}

/* ===== أزرار ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:16px;line-height:1.2;text-align:center;transition:transform .15s ease,box-shadow .15s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--honey);color:var(--ink);box-shadow:0 8px 18px -10px rgba(186,135,20,.7)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ghost{background:var(--surface);border-color:var(--border)}
.btn-soft{background:var(--lav-soft);border-color:#E3DAF2}
.btn-sm{min-height:42px;padding:0 16px;font-size:14.5px}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}

/* ===== شرائح ===== */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 17px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:15px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--honey);border-color:var(--ink);font-weight:700}
.chip .ck{display:none}
.chip[aria-pressed=true] .ck{display:block}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:999px;background:var(--lav-soft);font-size:12.5px;font-weight:700;white-space:nowrap}
.tag.sage{background:var(--sage)} .tag.peach{background:var(--peach-soft)} .tag.honey{background:var(--honey-soft)}

/* ===== صورة رمزية ===== */
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--ink);border:1px solid rgba(47,36,56,.08)}
.av.lg{width:76px;height:76px;font-size:30px;border-radius:26px}
.av.sm{width:30px;height:30px;font-size:13px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .meta{font-size:13px;color:var(--muted)}

/* ===== الرئيسية ===== */
.hello h1{font-size:27px;font-weight:800;line-height:1.35}
.hello p{color:var(--muted);margin-top:4px;font-size:15.5px}
.feature{position:relative;margin-top:20px;background:var(--honey);border-radius:var(--r-xl);padding:22px 20px 20px;overflow:hidden;isolation:isolate}
.feature::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,254,251,.28);top:-90px;left:-70px;z-index:-1}
.feature::after{content:"";position:absolute;width:120px;height:120px;border-radius:44% 56% 60% 40%/50% 45% 55% 50%;background:rgba(242,182,160,.45);bottom:-46px;right:-30px;z-index:-1}
.feature .eyebrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700}
.scallop{width:62px;height:62px;flex:none;display:grid;place-items:center;position:relative}
.scallop svg{position:absolute;top:0;right:0;bottom:0;left:0}
.scallop span{position:relative;font-size:11px;font-weight:800;line-height:1.15;text-align:center}
.feature blockquote{margin:6px 0 0;font-size:23px;line-height:1.75;font-weight:700}
.feature .by{margin-top:12px;font-size:14px;font-weight:500}
.feature .btn-row{margin-top:16px}
.feature .btn-ghost{background:rgba(255,254,251,.85);border-color:rgba(47,36,56,.12)}

.grid{display:grid;gap:14px}
.tcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 18px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.tcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}}
.tcard .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tcard h3{font-size:18.5px;font-weight:800;margin-top:12px;line-height:1.45}
.tcard .ex{margin-top:6px;font-size:16px;line-height:1.85;color:#4A3F52;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .ex.poem{white-space:pre-line}
.tcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--muted)}
.tcard .open{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--paper);border-radius:999px;min-height:38px;padding:0 14px;font-weight:700;font-size:14px;color:var(--ink)}
.tcard.mine{border-color:var(--honey);box-shadow:0 0 0 2px var(--honey-soft),var(--shadow)}

.nl-card{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;background:linear-gradient(135deg,#E6DCF5 0%,#F6E9F1 52%,#F8D3C3 100%);border:1px solid #E7DDF0}
.nl-card::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,254,251,.75),rgba(255,254,251,0) 70%);top:-50px;left:-40px;pointer-events:none}
.nl-card h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.nl-card p{margin-top:4px;font-size:15px}
.nl-card .btn{margin-top:14px;position:relative;z-index:1}

.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:4px 18px 10px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.voice{flex:0 0 250px;scroll-snap-align:start;background:var(--peach-soft);border-radius:var(--r-lg);padding:16px;border:1px solid #F3D3C6;display:flex;flex-direction:column;gap:10px}
.voice .snip{font-size:15px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* تقدم التأييد */
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;direction:rtl}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;display:block}
.dots i.on{background:var(--honey)}
.prog b{font-size:14.5px}

/* اقتباسات ملونة (عضوية) */
.qorg{flex:0 0 260px;scroll-snap-align:start;border-radius:28px 28px 28px 10px;padding:18px 18px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;cursor:pointer;border:1px solid rgba(47,36,56,.06);text-align:start}
.qorg:nth-child(3n+1){background:var(--lavender)} .qorg:nth-child(3n+2){background:var(--peach-soft)} .qorg:nth-child(3n){background:var(--sage)}
.qorg p{font-size:17px;line-height:1.8;font-weight:700}
.qorg .who .meta{color:#5d5262}

/* ===== البحث ===== */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 16px;min-height:52px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;min-height:50px;outline:none;font-size:16px;min-width:0}
.search:focus-within{border-color:var(--ink)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}

/* ===== القراءة ===== */
.reader{max-width:680px;margin:0 auto}
.reader-head{padding-top:10px}
.reader-head h1{font-size:28px;font-weight:800;line-height:1.4;margin-top:12px}
.reader-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.reader-meta .who{cursor:pointer;border:0;background:none;padding:0;text-align:start}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:13.5px;color:var(--muted)}
.legend .s-demo{color:var(--ink);background:var(--highlight);padding:1px 8px;border-radius:6px;text-decoration:underline dotted 1.5px;text-underline-offset:5px}
.paper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:26px 22px;margin-top:14px;box-shadow:var(--shadow)}
.read-body{font-size:19px;line-height:2.15;font-weight:400}
.read-body p+p{margin-top:1em}
.s{border-radius:7px;padding:3px 1px;cursor:pointer;transition:background .2s ease,box-shadow .2s ease;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@media (hover:hover){.s:hover{background:var(--lav-soft)}}
.s.hot{background:var(--highlight);text-decoration:underline dotted 1.6px;text-decoration-color:rgba(47,36,56,.5);text-underline-offset:8px}
.s.sel{background:var(--lavender);box-shadow:inset 0 -3px 0 var(--ink);text-decoration:none}
.s:focus-visible{outline:none;box-shadow:inset 0 -3px 0 var(--ink),0 0 0 2px var(--ink)}
.s .hm{font-size:.62em;vertical-align:super;margin-inline-start:3px;color:#8A6A12}
.s .mm{display:inline-block;vertical-align:middle;margin-inline-start:4px;transform:translateY(-1px)}
.s .mm svg{display:inline-block}
.s.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{background:var(--honey)}100%{background:var(--lavender)}}
.reader-foot{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.sample-box{background:var(--surface);border:1px dashed #CFC3D6;border-radius:var(--r-lg);padding:20px 18px;margin-top:12px}
.sample-box .read-body{font-size:18px;line-height:2}

/* شريط الجملة */
.pop{position:absolute;z-index:40;display:flex;align-items:center;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;box-shadow:0 12px 34px -12px rgba(47,36,56,.45);animation:popin .18s ease both;max-width:calc(100% - 20px)}
@keyframes popin{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
.pop button{display:inline-flex;align-items:center;gap:6px;min-height:44px;border-radius:999px;border:0;padding:0 14px;font-weight:700;font-size:14.5px;background:transparent;white-space:nowrap}
.pop .like{background:var(--paper)}
.pop .like.on{background:var(--honey)}
.pop .cnt{font-weight:500;color:var(--muted);font-size:13px}
.pop .like.on .cnt{color:var(--ink)}
.pop .x{width:44px;padding:0;justify-content:center;color:var(--muted)}
.pop .hottag{font-size:12px;font-weight:700;padding:0 8px;color:#6D5410}

/* ===== المقتبسات ===== */
.folders{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:14px 18px 8px}
.folders::-webkit-scrollbar{display:none}
.folder{flex:0 0 128px;height:108px;position:relative;border:0;background:none;padding:0;text-align:start;transition:transform .2s ease}
.folder .bk{position:absolute;top:12px;right:0;bottom:0;left:0;border-radius:14px 14px 18px 18px;background:var(--fc);filter:brightness(.94)}
.folder .bk::before{content:"";position:absolute;top:-11px;right:0;width:56px;height:20px;border-radius:10px 10px 0 0;background:inherit}
.folder .pp{position:absolute;top:8px;width:56%;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:0 2px 6px rgba(47,36,56,.08);background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#EDE6EF 9px 10px);background-position:0 12px;background-size:76% 100%;background-repeat:no-repeat}
.folder .pp.a{right:14px;transform:rotate(-6deg)} .folder .pp.b{right:40px;transform:rotate(5deg);top:12px}
.folder .fr{position:absolute;top:38px;right:0;bottom:0;left:0;border-radius:16px 16px 18px 18px;background:var(--fc);padding:8px 12px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 -1px 0 rgba(255,255,255,.5) inset}
.folder .fn{font-weight:800;font-size:15px;display:flex;align-items:center;gap:4px}
.folder .fc{font-size:12.5px;opacity:.75}
.folder[aria-pressed=true]{transform:translateY(-3px)}
.folder[aria-pressed=true] .fr{box-shadow:inset 0 0 0 2px var(--ink)}
.qlist{display:grid;gap:22px;margin-top:16px}
.qcard{position:relative}
.qcard::before{content:"";position:absolute;top:8px;right:10px;bottom:-9px;left:10px;border-radius:22px;background:var(--lav-soft);border:1px solid var(--border);transform:rotate(-1.6deg);z-index:0}
.qcard:nth-child(3n+2)::before{background:var(--peach-soft);transform:rotate(1.4deg)}
.qcard:nth-child(3n)::before{background:var(--sage-soft);transform:rotate(-1deg)}
.qcard .sheet-paper{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:20px 18px 12px;box-shadow:var(--shadow)}
.qcard .qm{position:absolute;top:-14px;right:16px;width:36px;height:36px;border-radius:12px;background:var(--honey);display:grid;place-items:center;font-size:26px;font-weight:800;line-height:1;padding-top:10px}
.qcard blockquote{margin:6px 0 0;font-size:18.5px;line-height:1.95;font-weight:500;white-space:pre-line}
.qcard .src{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--muted)}
.qcard .src b{color:var(--ink)}
.qcard .acts{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.qcard .acts .grow{flex:1}
.qcard .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
.qcard .acts .icon-btn{width:40px;height:40px}
.empty-art{width:150px;height:110px;margin:0 auto 14px;position:relative}
.empty-art i{position:absolute;width:96px;height:72px;border-radius:14px;border:1px solid var(--border);display:block}
.empty-art i:nth-child(1){background:var(--lavender);right:16px;top:22px;transform:rotate(-8deg)}
.empty-art i:nth-child(2){background:var(--peach-soft);right:36px;top:16px;transform:rotate(5deg)}
.empty-art i:nth-child(3){background:var(--surface);right:26px;top:28px;background-image:repeating-linear-gradient(to bottom,transparent 0 11px,#EDE6EF 11px 12px);background-position:12px 16px;background-size:70% 60%;background-repeat:no-repeat}

/* ===== حساب / ملف ===== */
.profile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:22px 20px;box-shadow:var(--shadow)}
.profile .top{display:flex;gap:14px;align-items:center}
.profile h1{font-size:23px;font-weight:800;line-height:1.35}
.profile .bio{margin-top:14px;font-size:16px;line-height:1.85}
.profile .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.status{margin-top:14px;border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.status.wait{background:var(--lav-soft)} .status.ok{background:var(--sage)} .status.later{background:var(--honey-soft)}
.status h3{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.status p{font-size:14.5px}
.list{display:grid;gap:10px}
.row-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;width:100%;text-align:start}
.row-card .grow{flex:1;min-width:0}
.row-card .t{font-weight:700;font-size:15.5px}
.row-card .d{font-size:13.5px;color:var(--muted)}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);font-size:15px}
.kv:last-child{border-bottom:0}
.three{display:grid;gap:10px;margin-top:14px}
.three div{background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.7}
.three b{display:block;font-size:15px}

/* ===== المحرر ===== */
.editor{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow);margin-top:14px}
.editor input.ttl{width:100%;border:0;border-bottom:1px solid var(--border);background:none;font-size:21px;font-weight:800;padding:8px 2px 12px;outline:none}
.editor textarea{width:100%;min-height:260px;border:0;background:none;resize:vertical;font-size:19px;line-height:2;padding:12px 2px;outline:none}
.editor input.ttl:focus,.editor textarea:focus{background:linear-gradient(var(--paper),var(--paper)) bottom/100% 0 no-repeat}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;margin-top:6px;flex-wrap:wrap}
.counter .num{font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:var(--paper);overflow:hidden;margin-top:8px;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--honey);border-radius:9px;transition:width .2s}
.bar.over i{background:repeating-linear-gradient(45deg,var(--peach) 0 6px,#E79C82 6px 12px)}
.over-msg{display:flex;gap:8px;align-items:center;background:var(--peach-soft);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;margin-top:10px}
.dirty{font-size:13px;color:var(--muted)}

/* ===== النشرة ===== */
.nl-hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:26px 22px;background:linear-gradient(140deg,#E3D8F4 0%,#F4E6F0 55%,#F7CDBB 100%)}
.nl-hero::before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,254,251,.85),rgba(255,254,251,0) 68%);top:-90px;left:-60px}
.nl-hero > *{position:relative}
.nl-hero h1{font-size:26px;font-weight:800;line-height:1.4;margin-top:8px}
.nl-hero p{margin-top:6px;font-size:16px}
.issue{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;box-shadow:var(--shadow)}
.issue-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper)}
.issue-body{padding:20px}
.issue h4{margin:0 0 10px;font-size:13px;letter-spacing:0;color:var(--muted);font-weight:700}
.iq{display:block;width:100%;text-align:start;border:0;background:none;padding:12px 0;border-bottom:1px dashed var(--border);font-size:17px;line-height:1.85}
.iq:last-child{border-bottom:0}
.iq small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.iq .go{font-weight:700;text-decoration:underline;text-decoration-color:var(--honey);text-decoration-thickness:2px;text-underline-offset:4px}
.week{background:var(--highlight);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:18px}

/* ===== النماذج والنوافذ ===== */
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.input{width:100%;min-height:52px;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:0 16px;outline:none;font-size:16px}
textarea.input{padding:12px 16px;min-height:96px;line-height:1.8;resize:vertical}
.input:focus{border-color:var(--ink)}
.input.email{direction:ltr;text-align:left}
.input.code{direction:ltr;text-align:center;letter-spacing:10px;font-size:24px;font-weight:800}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:14.5px;line-height:1.75;cursor:pointer}
.check input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--ink);flex:none}
.msg{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 14px;font-size:14.5px;line-height:1.7;margin-top:12px}
.msg.err{background:var(--peach-soft)} .msg.ok{background:var(--sage)} .msg.info{background:var(--lav-soft)}
.msg .ic{margin-top:2px}
.demo-note{border:1.5px dashed #BFAFD2;background:var(--lav-soft);border-radius:14px;padding:10px 14px;font-size:14px;margin-top:12px;line-height:1.75}
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(47,36,56,.34);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(100%,560px);max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 20px calc(24px + var(--safe-b));animation:up .26s cubic-bezier(.2,.8,.2,1) both;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--border);margin:6px auto 12px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet-h h2{font-size:20px;font-weight:800;line-height:1.45}
.sheet-h p{font-size:14.5px;color:var(--muted);margin-top:4px}
.sheet .btn-row{margin-top:18px}
.steps{display:flex;gap:6px;margin:4px 0 2px}
.steps i{height:5px;flex:1;border-radius:9px;background:var(--border)}
.steps i.on{background:var(--ink)}
.role{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:12px 14px;border:1px solid var(--border);border-radius:18px;background:var(--surface);margin-top:8px}
.role[aria-current=true]{background:var(--honey-soft);border-color:var(--ink)}
.role .grow{flex:1;min-width:0}
.role .t{font-weight:800;font-size:15px}
.role .d{font-size:13px;color:var(--muted)}
.success-burst{width:64px;height:64px;border-radius:22px;background:var(--sage);display:grid;place-items:center;margin-bottom:10px}

/* ===== التنقل السفلي ===== */
.nav{position:fixed;z-index:30;bottom:calc(10px + var(--safe-b));left:50%;transform:translateX(-50%);width:min(calc(100% - 20px),520px);height:var(--nav-h);background:var(--surface);border:1px solid var(--border);border-radius:28px;box-shadow:0 14px 34px -16px rgba(47,36,56,.35);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:2px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:22px;padding:0}
.nav button[aria-current=page]{color:var(--ink);font-weight:800;background:var(--lav-soft)}
.nav .wr{width:42px;height:42px;border-radius:50%;background:var(--honey);display:grid;place-items:center;color:var(--ink);margin-top:-2px;box-shadow:0 6px 14px -6px rgba(186,135,20,.8)}
.nav button.w[aria-current=page]{background:none}
.nav button.w[aria-current=page] .wr{box-shadow:0 0 0 2px var(--ink)}
.toast{position:fixed;z-index:120;left:50%;bottom:calc(var(--nav-h) + 24px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:11px 12px 11px 18px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500;box-shadow:var(--shadow-lift);max-width:calc(100% - 28px);width:max-content;animation:toastin .25s ease both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast .ta{border:0;background:var(--honey);color:var(--ink);border-radius:999px;min-height:34px;padding:0 14px;font-weight:800;font-size:13.5px;white-space:nowrap}
.toast .tx{padding-inline-start:6px}

/* ===== سطح المكتب ===== */
@media (min-width:760px){
  .app{padding-left:32px;padding-right:32px}
  .chips,.hscroll,.folders{margin:0 -32px;padding-left:32px;padding-right:32px}
  .subbar{margin:0 -32px;padding-left:32px;padding-right:32px}
  .grid.two{grid-template-columns:1fr 1fr}
  .hello h1{font-size:32px}
  .read-body{font-size:20px}
  .paper{padding:36px 40px}
  .three{grid-template-columns:repeat(3,1fr)}
  .qlist{grid-template-columns:1fr 1fr;gap:26px}
}
@media (min-width:1000px){
  .home-split{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
  .home-split .side{position:sticky;top:16px}
  .home-split .grid.two{grid-template-columns:1fr}
  .feature blockquote{font-size:26px}
}
@media (max-width:380px){
  .app{padding-left:14px;padding-right:14px}
  .chips,.hscroll,.folders{margin:0 -14px;padding-left:14px;padding-right:14px}
  .subbar{margin:0 -14px;padding-left:14px;padding-right:14px}
  .nav button{font-size:10.5px}
  .pill-sm .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

/* ================= الجولة الثانية: دفء وحضور ================= */

.page-h{font-size:26px;font-weight:800;margin-top:6px}
.page-sub{color:var(--muted);margin-top:2px;font-size:15px;line-height:1.8}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#5B4E63;position:relative;z-index:1}
.eyebrow::before{content:"";width:18px;height:3px;border-radius:3px;background:var(--honey);flex:none}
.tl{display:block;font-size:13.5px;color:var(--muted);font-weight:500;line-height:1.55}
.by-line{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:start;min-width:0;color:var(--ink)}

.mark{background:linear-gradient(100deg,rgba(255,232,140,0) .5%,#FFF0AA 2%,#FFE68A 55%,#FFF0AA 97%,rgba(255,232,140,0) 99.5%) 0 90%/100% 58% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;border-radius:.25em .6em .35em .5em}
.feed{display:flex;flex-direction:column;gap:26px;margin-top:16px}
.b-full{background:var(--surface);border:1px solid var(--border);border-radius:28px 28px 28px 8px;padding:20px 20px 16px;box-shadow:var(--shadow)}
.b-full h3{font-size:21px;font-weight:800;margin:14px 0 4px;line-height:1.45}
.read-body.sm{font-size:18px;line-height:2.05}
.b-full .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:13px;flex-wrap:wrap}

.qwrap{position:relative;padding:0 0 12px 16px}
.qwrap::before{content:"";position:absolute;top:16px;bottom:0;left:0;right:26px;border-radius:10px 30px 30px 30px;background:var(--lavender)}
.b-quote{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px 30px 30px 30px;padding:24px 20px 20px;box-shadow:var(--shadow-lift)}
.b-quote blockquote{margin:12px 0 14px;font-size:23px;line-height:1.85;font-weight:700}
.ribbon{position:absolute;top:-1px;left:24px;width:20px;height:46px;background:var(--peach);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);z-index:2}
.tcard .mood{margin:-18px -18px 14px;height:112px;border-radius:24px 24px 0 0;overflow:hidden}

.tcard h3{margin-top:10px}
.b-writer{position:relative;background:var(--tint,var(--peach-soft));border-radius:34px 34px 34px 10px;padding:22px 20px 20px;overflow:hidden}
.b-writer::after,.corner::after,.about::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,254,251,.34);top:-60px;left:-50px;pointer-events:none}
.w-top{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative;z-index:1;min-width:0}

.w-top h3{font-size:21px;font-weight:800;line-height:1.35}
.blob{flex:none;width:58px;height:58px;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--ink);border-radius:46% 54% 42% 58%/55% 45% 55% 45%;box-shadow:0 0 0 4px rgba(255,254,251,.45)}

.w-line{display:block;width:100%;text-align:start;border:0;background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:14px;font-size:17px;line-height:1.95;font-weight:500;position:relative;z-index:1;color:var(--ink)}

.w-line.big{font-size:20px;border:1px solid var(--border);box-shadow:var(--shadow);margin-top:10px}
.b-writer .btn,.corner .btn,.about .btn{position:relative;z-index:1}
.b-writer > .btn,.corner > .btn{margin-top:14px}
.b-voice{background:var(--surface);border:1.5px dashed #D6C8DE;border-radius:28px;padding:20px}
.sample-mini{background:var(--paper);border-radius:18px;padding:14px 16px;margin-top:14px;font-size:16px;line-height:1.9}
.sample-mini b{display:block;font-size:14.5px;margin-bottom:4px}
.sample-mini p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.b-voice .prog{margin-top:14px}
.wp{font-size:14px;color:var(--muted);margin-top:6px}

.feed-end{text-align:center;padding:22px 12px 4px}
.feed-end h3{font-size:18px;font-weight:800}

.empty-art.small{transform:scale(.8);margin-bottom:0}
.side{display:none}
@media (min-width:1000px){.side{display:block}.home-split{grid-template-columns:1.5fr 1fr}}
.voice{background:var(--tint,var(--peach-soft));border-color:transparent;border-radius:28px 28px 28px 10px}

/* القراءة */
.paper{position:relative}
.paper .ribbon{left:30px}
.reader .paper{padding-top:52px}
.sample-box{padding-top:46px}
.letter{padding-top:52px}
.legend{flex-wrap:nowrap;align-items:flex-start}.legend .s-demo{flex:none}
.paper-foot{margin-top:18px;padding-top:12px;border-top:1px dashed var(--border);font-size:13px;color:var(--muted)}

.sample-box{position:relative}

/* شريط الجملة */

.pop-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:2px 10px 2px 4px}

.corner h1{font-size:28px;font-weight:800;line-height:1.3}
.corner-label{margin-top:20px;font-size:13px;font-weight:800;color:#5B4E63;position:relative;z-index:1}

.from{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:10px 12px;border:0;border-radius:16px;background:var(--paper);text-align:start;color:var(--ink)}

@media (max-width:380px){.b-full.poemish{margin-inline-start:12px}.qwrap{padding-left:10px}.b-quote blockquote{font-size:21px}}

/* ================= الوضع الداكن ================= */
:root{--on-honey:#2F2438;color-scheme:light}
.top-actions .theme-btn{width:42px;height:42px}
body{transition:background-color .3s ease,color .3s ease}
html[data-theme=dark]{
  color-scheme:dark;
  --paper:#1C1720; --surface:#27202C; --ink:#F1EAE3; --muted:#B5A9B7;
  --honey:#F2C25A; --lavender:#463C55; --peach:#7E5247; --sage:#343C31;
  --highlight:rgba(242,194,90,.2); --border:#3B3242;
  --honey-soft:#45391F; --lav-soft:#322A3C; --peach-soft:#41302C; --sage-soft:#2B3428;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 20px 44px -18px rgba(0,0,0,.7);
}
html[data-theme=dark] body{background:var(--paper)}
html[data-theme=dark] .btn-primary,html[data-theme=dark] .chip[aria-pressed=true],html[data-theme=dark] .nav .wr,
html[data-theme=dark] .pop .like.on,html[data-theme=dark] .toast .ta,html[data-theme=dark] .qcard .qm{color:var(--on-honey)}
html[data-theme=dark] .chip[aria-pressed=true]{border-color:var(--honey)}
html[data-theme=dark] .btn-primary{box-shadow:0 8px 18px -10px rgba(0,0,0,.8)}
html[data-theme=dark] .btn-ink{background:var(--ink);color:#1C1720}
html[data-theme=dark] .toast{background:#F1EAE3;color:#1C1720}
html[data-theme=dark] .s.hot,html[data-theme=dark] .mark,html[data-theme=dark] .legend .s-demo{background:linear-gradient(100deg,rgba(242,194,90,0) .4%,rgba(242,194,90,.26) 1.8%,rgba(242,194,90,.34) 55%,rgba(242,194,90,.26) 98%,rgba(242,194,90,0) 99.6%) 0 92%/100% 62% no-repeat}
html[data-theme=dark] .s.sel{background:var(--lavender);box-shadow:inset 0 -3px 0 var(--honey)}
html[data-theme=dark] .s:focus-visible{box-shadow:inset 0 -3px 0 var(--honey),0 0 0 2px var(--honey)}
html[data-theme=dark] .s .hm,html[data-theme=dark] .pop-meta .hottag,html[data-theme=dark] .pop .hottag{color:var(--honey)}
html[data-theme=dark] .tcard .ex{color:#D6CDD3}
html[data-theme=dark] .eyebrow,html[data-theme=dark] .corner-label{color:#D3C7D6}
html[data-theme=dark] .nav button[aria-current=page]{background:var(--lavender)}
html[data-theme=dark] .nl-card,html[data-theme=dark] .b-letter,html[data-theme=dark] .nl-hero{background:linear-gradient(150deg,#3A2F47 0%,#3A2C38 55%,#4A3029 100%);border-color:transparent}
html[data-theme=dark] .nl-hero::before,html[data-theme=dark] .nl-card::after{background:radial-gradient(circle,rgba(242,194,90,.14),rgba(242,194,90,0) 68%)}
html[data-theme=dark] .b-writer::after,html[data-theme=dark] .corner::after,html[data-theme=dark] .about::after{background:rgba(255,255,255,.04)}
html[data-theme=dark] .tape{background:rgba(241,234,227,.14)!important;border-color:rgba(241,234,227,.08)}
html[data-theme=dark] .blob{box-shadow:0 0 0 4px rgba(255,255,255,.05)}
html[data-theme=dark] .b-writer .tag,html[data-theme=dark] .corner .tag{background:rgba(28,23,32,.45)}
html[data-theme=dark] .b-voice{border-color:#4A3F52}
html[data-theme=dark] .demo-note{border-color:#5A4C6A}
html[data-theme=dark] .folder .pp{background-image:repeating-linear-gradient(to bottom,transparent 0 9px,#3B3242 9px 10px)}
html[data-theme=dark] .empty-art i:nth-child(3){background-image:repeating-linear-gradient(to bottom,transparent 0 11px,#3B3242 11px 12px)}
html[data-theme=dark] .mood svg{filter:brightness(.78) saturate(.85)}
html[data-theme=dark] .stamp{color:var(--peach);outline-color:var(--peach)}
html[data-theme=dark] .scallop path{fill:var(--lavender)}
html[data-theme=dark] .overlay{background:rgba(0,0,0,.55)}
html[data-theme=dark] .week{background:rgba(242,194,90,.12)}
html[data-theme=dark] .tag.honey{color:var(--ink)}
html[data-theme=dark] :focus-visible{outline-color:var(--honey)}
@media (prefers-reduced-motion:reduce){body{transition:none}}

/* ================= شاشة الترحيب ================= */
html.intro-open,html.intro-open body{overflow:hidden}
.intro{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;animation:fade .45s ease both;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.intro:focus{outline:none}
.intro.out{animation:iOut .45s ease forwards;pointer-events:none}
@keyframes iOut{to{opacity:0;transform:scale(1.04)}}
.i-bg{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none}
@supports (overflow:clip){.intro,.i-bg,.scene,.i-stage{overflow:clip}}
.i-bg i{position:absolute;display:block;border-radius:50%;filter:blur(46px);opacity:.7;animation:iDrift 15s ease-in-out infinite alternate}
.i-bg i:nth-child(1){width:340px;height:340px;background:var(--lavender);top:-110px;right:-110px}
.i-bg i:nth-child(2){width:280px;height:280px;background:var(--peach);bottom:6%;left:-120px;animation-duration:18s;opacity:.55}
.i-bg i:nth-child(3){width:200px;height:200px;background:var(--honey);top:42%;right:12%;animation-duration:21s;opacity:.28}
@keyframes iDrift{to{transform:translate(-50px,60px) scale(1.18)}}
.i-top{position:relative;z-index:3;padding:calc(var(--safe-t) + 12px) 16px 0;max-width:640px;width:100%;margin:0 auto}
.i-bars{display:flex;gap:5px}
.i-bars span{flex:1;height:4px;border-radius:4px;background:rgba(47,36,56,.13);overflow:hidden}
.i-bars b{display:block;height:100%;width:0;background:var(--ink);border-radius:4px}
.i-ctrl{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.i-brand{font-weight:800;font-size:18px}
.i-btns{display:flex;gap:8px;align-items:center}
.i-btns .icon-btn{width:42px;height:42px}
.i-stage{position:relative;z-index:2;flex:1;display:grid;min-height:0;cursor:pointer}
.scene{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px 24px 12px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s;overflow:hidden}
.scene.on{opacity:1;visibility:visible}
.scene h2{font-size:clamp(23px,6.4vw,34px);font-weight:800;line-height:1.6;margin-top:26px}
.kicker{font-size:14px;font-weight:800;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.kicker::before{content:"";width:18px;height:3px;border-radius:3px;background:var(--honey)}
.scene.on .a{animation:iRise .8s cubic-bezier(.2,.8,.2,1) both}
.scene.on .a1{animation-delay:.1s}.scene.on .a2{animation-delay:.5s}.scene.on .a3{animation-delay:1s}.scene.on .a4{animation-delay:1.4s}.scene.on .a5{animation-delay:1.6s}
@keyframes iRise{from{opacity:0;transform:translateY(18px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.intro.paused *,.intro.paused *::before,.intro.paused *::after{animation-play-state:paused!important}
.i-logo{width:min(80vw,360px);height:auto;overflow:visible}
.i-logo text{font-family:var(--font);font-weight:800;font-size:132px;fill:transparent;stroke:var(--ink);stroke-width:2;stroke-dasharray:1100;stroke-dashoffset:1100}
.i-logo .ul{fill:none;stroke:var(--honey);stroke-width:9;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200}
.scene.on .i-logo text{animation:iDraw 1.7s ease forwards,iFill .9s 1.2s ease forwards}
.scene.on .i-logo .ul{animation:iDraw .8s 1.7s ease forwards}
@keyframes iDraw{to{stroke-dashoffset:0}}
@keyframes iFill{to{fill:var(--ink);stroke-width:0}}
.s-logo p{font-size:21px;line-height:1.85;font-weight:500;margin-top:4px}
.scene.on.s-logo p{animation-delay:1.9s}
.i-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:8px 26px 26px 26px;padding:20px;box-shadow:var(--shadow-lift);width:min(100%,430px);text-align:start;margin-top:18px}
.i-typed{font-size:18px;line-height:2;min-height:112px}
.i-typed::after{content:"";display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:middle;margin-inline-start:3px;animation:iBlink 1s steps(1) infinite}
@keyframes iBlink{50%{opacity:0}}
.i-count{font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.i-bar{height:4px;border-radius:4px;background:var(--border);margin-top:6px;overflow:hidden}
.i-bar i{display:block;height:100%;width:0;background:var(--honey)}
.i-read{font-size:18.5px;line-height:2.15;padding-bottom:30px}
.i-s{cursor:pointer;border-radius:6px;padding:2px 1px;transition:background-size .8s cubic-bezier(.2,.8,.2,1);background:linear-gradient(100deg,rgba(255,232,140,0) .5%,#FFF0AA 2%,#FFE68A 55%,#FFF0AA 97%,rgba(255,232,140,0) 99.5%) 100% 92%/0% 62% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.i-s.hit{background-size:100% 62%}
.i-s:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.i-src{font-size:13px;color:var(--muted);margin-top:8px}
.i-pop{position:absolute;left:16px;bottom:-20px;display:flex;align-items:center;gap:8px;background:var(--honey);color:#2F2438;border-radius:999px;padding:9px 16px;font-weight:800;font-size:14px;box-shadow:var(--shadow-lift);opacity:0;transform:translateY(10px) scale(.9);transition:opacity .35s,transform .45s cubic-bezier(.3,1.6,.5,1)}
.i-pop.show{opacity:1;transform:none}
.i-pop.show svg{animation:beat .6s .12s}
.i-voices{display:flex;flex-direction:column;gap:12px;width:min(100%,400px);margin-top:20px}
.i-v{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:24px 24px 24px 8px;padding:12px 14px;text-align:start}
.i-v b{display:block;font-size:16px}
.i-v:nth-child(2){margin-inline-start:30px}
.i-v:nth-child(3){margin-inline-end:24px}
.scene.on .i-v{animation:iRise .8s var(--dl) both,iFloat 4.5s calc(var(--dl) + .8s) ease-in-out infinite alternate}
@keyframes iFloat{from{transform:none}to{transform:translateY(-5px)}}
.i-dots{display:flex;gap:9px;margin-top:24px}
.i-dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:block}
.scene.on .i-dots i{animation:iDot .4s calc(.6s + var(--k) * .26s) both}
@keyframes iDot{from{background:transparent;transform:scale(.6)}60%{transform:scale(1.3)}to{background:var(--honey);transform:none}}
.i-welcome{margin-top:22px;background:var(--sage);border-radius:20px;padding:12px 18px;font-weight:800;font-size:16.5px;opacity:0}
.scene.on .i-welcome{animation:iRise .8s 3.5s both}
.i-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px;max-width:440px}
.i-go{margin-top:26px;min-width:230px}
.i-foot{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px calc(var(--safe-b) + 18px);max-width:640px;width:100%;margin:0 auto}
.i-hint{flex:1;text-align:center;font-size:12.5px;color:var(--muted)}
html[data-theme=dark] .i-bars span{background:rgba(241,234,227,.16)}
html[data-theme=dark] .i-s{background-image:linear-gradient(100deg,rgba(242,194,90,0) .5%,rgba(242,194,90,.3) 2%,rgba(242,194,90,.4) 55%,rgba(242,194,90,.3) 97%,rgba(242,194,90,0) 99.5%)}
html[data-theme=dark] .i-bg i{opacity:.45}
@media (max-width:380px){.i-dots{gap:6px}.i-dots i{width:18px;height:18px}.i-typed{font-size:17px}}
@media (max-height:640px){.scene h2{margin-top:14px;font-size:22px}.i-typed{min-height:80px}}
@media (prefers-reduced-motion:reduce){.i-logo text{fill:var(--ink);stroke-dashoffset:0;stroke-width:0}.i-logo .ul{stroke-dashoffset:0}.i-dots i{background:var(--honey)}.i-welcome{opacity:1}.i-typed::after{display:none}}

/* ================= ركني ================= */
.room-page .rp-head{display:flex;align-items:center;gap:14px;margin-top:10px}
.room-page .rp-head h1{font-size:25px;font-weight:800;line-height:1.3}
.rp-bio{font-size:16.5px;line-height:1.85;margin-top:10px}
.room-wrap{position:relative;margin:16px 0 0;border-radius:28px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-lift);aspect-ratio:400/306;background:#EADFCF}
.room-svg{display:block;width:100%;height:100%}
.room-temp{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:center;background:rgba(255,254,251,.9);color:#2F2438;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px}
.room-cap{font-size:13px;color:var(--muted);margin-top:10px}
.motto{font-size:19px;font-weight:700;line-height:1.7;margin-top:6px}
.room-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.room-acts .btn{flex:0 1 auto}
.room-acts .btn[aria-pressed=true]{background:var(--lav-soft);border-color:#CFC2E6}
.first-note{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px dashed var(--border);border-radius:22px;padding:16px 18px}
.first-note b{display:block;font-size:16px}.first-note p{font-size:14.5px;color:var(--muted);margin-top:2px}
.r-hit{cursor:pointer;outline:none}
.r-hit .hit-ring{fill:transparent;stroke:transparent;stroke-width:2.5}
.r-hit:focus-visible .hit-ring{stroke:#2F2438;stroke-dasharray:5 4}
@media (hover:hover){.r-hit:hover .hit-ring{fill:rgba(255,255,255,.12);stroke:rgba(47,36,56,.35);stroke-dasharray:4 4}}
.anim .r-rain{animation:rRain .9s linear infinite}
.anim .r-snow{animation:rSnow 11s linear infinite}
.anim .r-wave{animation:rWave 6s ease-in-out infinite alternate}
.anim .r-sway{animation:rSway 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.anim .r-fog{animation:rFog 16s ease-in-out infinite alternate}
.anim .r-drip{animation:rDrip 8s ease-in infinite}
.anim .r-flame{animation:rFlame 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rRain{from{transform:translate(0,0)}to{transform:translate(-8px,130px)}}
@keyframes rSnow{from{transform:translate(0,0)}to{transform:translate(-6px,130px)}}
@keyframes rWave{from{transform:translateX(0)}to{transform:translateX(-10px)}}
@keyframes rSway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.4deg)}}
@keyframes rFog{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
@keyframes rDrip{0%{transform:translateY(0);opacity:0}10%{opacity:1}80%{opacity:.9}100%{transform:translateY(46px);opacity:0}}
@keyframes rFlame{0%{transform:scale(1,1)}50%{transform:scale(.92,1.06)}100%{transform:scale(1.04,.95)}}
.glimpse{flex:none;width:104px;height:80px;border-radius:18px 18px 18px 6px;overflow:hidden;border:2px solid rgba(255,254,251,.85);box-shadow:0 6px 16px -10px rgba(47,36,56,.5);display:block;background:#EADFCF}
.glimpse.sm{width:76px;height:58px;border-radius:14px 14px 14px 5px}
.glimpse svg{width:100%;height:100%}
.swatch{flex:none;width:42px;height:42px;border-radius:14px;overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.swatch svg{width:100%;height:100%}
.frame-big{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:18px;margin-top:14px;background:var(--paper)}
.frame-quote{margin:16px 0 0;font-size:24px;font-weight:700;line-height:1.75;background:var(--paper);border-radius:20px;padding:22px 20px}
/* المحرّر */
.room-editor{position:fixed;top:0;right:0;bottom:0;left:0;z-index:95;background:var(--paper);display:flex;flex-direction:column;animation:fade .25s ease both}
.re-preview{position:relative;flex:none;height:clamp(190px,37vh,330px);background:#EADFCF;border-bottom:1px solid var(--border);padding-top:var(--safe-t)}
.re-preview .room-svg{width:100%;height:100%}
.re-cap{position:absolute;bottom:8px;right:10px;background:rgba(255,254,251,.9);color:#2F2438;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.re-panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;margin-top:-18px;position:relative;box-shadow:0 -10px 30px -18px rgba(47,36,56,.4)}
.re-head{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px 4px}
.re-head h2{font-size:20px;font-weight:800}
.re-dirty{font-size:12.5px;color:var(--muted)}
.re-tabs{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.re-tabs button{flex:1;min-height:42px;border:0;border-radius:999px;background:var(--paper);font-weight:700;font-size:14.5px;white-space:nowrap;padding:0 12px}
.re-tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.re-body{flex:1;min-height:0;overflow:auto;padding:14px 18px 20px;overscroll-behavior:contain}
.re-foot{display:flex;gap:10px;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--border);background:var(--surface)}
.re-foot .btn{flex:1}
.re-lbl{font-size:14px;font-weight:800;margin:12px 0 8px}
.re-sub{font-size:14px;color:var(--muted);margin-top:16px}
.re-note{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.75}
.re-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.re-preset{border:2px solid transparent;background:var(--paper);border-radius:18px;padding:5px 5px 8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;font-weight:700;font-size:13px}
.re-preset[aria-pressed=true]{border-color:var(--ink);background:var(--honey-soft)}
.re-thumb{display:block;aspect-ratio:160/112;border-radius:13px;overflow:hidden}
.re-thumb svg{width:100%;height:100%}
.re-seg{display:flex;flex-wrap:wrap;gap:6px}
.re-seg button{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:14.5px}
.re-seg button[aria-pressed=true]{background:var(--honey);border-color:var(--ink);font-weight:800;color:#2F2438}
.re-img{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.re-imgprev{width:72px;height:90px;border-radius:10px;overflow:hidden;border:4px solid #8A6B52;flex:none}
.re-imgprev img{width:100%;height:100%;object-fit:cover;display:block}
@media (min-width:860px){
  .room-editor{flex-direction:row}
  .re-preview{flex:1;height:auto;border-bottom:0;display:flex;align-items:center;padding:24px}
  .re-preview .room-svg{height:auto;border-radius:28px;box-shadow:var(--shadow-lift)}
  .re-cap{bottom:34px;right:40px}
  .re-panel{flex:none;width:430px;margin:0;border-radius:0;box-shadow:-10px 0 30px -20px rgba(47,36,56,.4)}
}
@media (max-height:640px){.re-preview{height:30vh}}
html[data-theme=dark] .re-tabs button[aria-selected=true]{background:var(--honey);color:#2F2438}
html[data-theme=dark] .room-wrap{border-color:#3B3242}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}}

<body>
<div class="app" id="app">
  <main id="main" tabindex="-1"><div style="padding:40px 8px;text-align:center;line-height:1.9">
    <h1 style="font-size:22px;margin-bottom:8px">مَيل — نموذج تفاعلي</h1>
    <p>إذا كنت ترى هذه الرسالة، فالتطبيق الذي فتح الملف يعرضه كمعاينة ثابتة ولا يشغّل التفاعل.</p>
    <p style="margin-top:8px">افتح الملف في Safari أو Chrome، أو افتح رابط المعاينة المنشور.</p></div></main>
</div>
<nav class="nav" id="nav" aria-label="التنقل الرئيسي"></nav>
<div id="live" class="sr" aria-live="polite"></div>

<script>
/* =========================================================
   «مَيل» — نموذج تفاعلي محلي بالكامل
   لا خوادم، لا رسائل فعلية. التخزين: localStorage مع بديل في الذاكرة.
   ========================================================= */
const BRAND = 'مَيل';           // الاسم المؤقت — غيّريه هنا فقط
const DEMO_CODE = '123456';
const LIMIT = 1000, NEEDED = 10, DAY = 864e5, WEEK = 7 * DAY;
const CATS = ['أدب', 'شعر', 'تأملات', 'اقتصاد', 'أفكار'];
const KEY = 'mayl-proto-v2';
const DEMO_HOST = 'https://mayl.example';

/* ---------- المحتوى التجريبي (أصلي وخيالي) ----------
   ¶ = فقرة جديدة، ★ = جملة شائعة (بيانات عرض فقط)، \n داخل الجملة = سطر شعر */

function openPop(sid, el, keepFocus) {
  if (popEl) popEl.remove();
  $$('.s.sel').forEach(e => { e.classList.remove('sel'); e.setAttribute('aria-expanded', 'false'); });
  el.classList.add('sel'); el.setAttribute('aria-expanded', 'true'); ui.sel = sid;

  popEl.innerHTML = popInner(sid); document.body.appendChild(popEl);

}
function positionPop(el) {
  if (!popEl) return;
  const rs = el.getClientRects(); if (!rs.length) return;
  const first = rs[0], last = rs[rs.length - 1];
  const pw = popEl.offsetWidth, ph = popEl.offsetHeight;
  const navTop = $('#nav').getBoundingClientRect().top;
  let top = last.bottom + 10;
  if (top + ph > navTop - 10) { top = first.top - ph - 10; }
  if (top < 70) top = Math.min(last.bottom + 10, navTop - ph - 12);
  let left = last.left + last.width / 2 - pw / 2;
  left = Math.max(10, Math.min(left, document.documentElement.clientWidth - pw - 10));
  popEl.style.top = (top + window.scrollY) + 'px'; popEl.style.left = (left + window.scrollX) + 'px';
}

  openSheet(`<div class="sheet-h"><div><h2>معاينة</h2><p>هكذا سيظهر نصّك للقرّاء.</p></div>${closeBtn()}</div>

    <div class="btn-row"><button class="btn btn-ghost" data-act="sheet-close">العودة للتحرير</button></div>`);
}
function tryPublish() {
  const m = me(); const b = buf(); const n = glen(b.title) + glen(b.body);
  if (!canPublishNow(m) || n > LIMIT || !b.body.trim()) { toast(publishWhy(m, n, b).split('.')[0]); return; }
  openSheet(`<div class="sheet-h"><div><h2>نشر «${esc(b.title || 'بلا عنوان')}»؟</h2><p>${ar(n)} / ${ar(LIMIT)} حرف · ${esc(b.cat)}</p></div>${closeBtn()}</div>
    <div class="msg info">${ic('info', 18)}<span>هذا نصّك لهذا الأسبوع. بعد النشر يُتاح نشرك القادم ${fmtDay(Date.now() + WEEK)}.</span></div>
    <div class="btn-row"><button class="btn btn-ghost" data-act="sheet-close">ليس الآن</button><button class="btn btn-primary" data-act="do-publish">نشر</button></div>`);
}
function doPublish() {
  const m = me(); const b = buf(); const n = glen(b.title) + glen(b.body);
  if (!canPublishNow(m) || n > LIMIT || !b.body.trim()) { closeSheet(); return; }
  const segs = segment(b.body); const cnt = segs.filter(s => s !== '¶' && s !== '↵').length;
  const t = { id: 'u' + Date.now().toString(36), author: m.id, cat: b.cat, title: b.title.trim(), poem: false, pick: false, feature: false, createdAt: Date.now(), segs, hot: [], base: Array(cnt).fill(0) };
  S.texts.push(t); m.lastPub = Date.now(); m.justApproved = false; delete S.drafts[m.id]; delete ui.buf[m.id]; save();
  closeSheet(); hist.length = 0; view = { name: 'home', p: {} }; go('read', { id: t.id }); toast('نُشر نصّك. شكرًا لأنك شاركته معنا');
}
function segment(body) {
  const out = [];
  body.replace(/\r/g, '').trim().split(/\n\s*\n+/).forEach((para, pi) => {
    if (pi) out.push('¶');
    para.split('\n').forEach((line, li) => {
      if (li) out.push('↵');
      const parts = line.match(/[^.!؟?…]+(?:[.!؟?…]+[»"”)]*)|[^.!؟?…]+$/g) || [];
      parts.map(p => p.trim()).filter(Boolean).forEach(p => out.push(p));
    });
  });
  return out;
}

/* ================= شاشة الترحيب (تظهر مرة واحدة) ================= */
const INTRO_KEY = 'mayl-intro-v1';

const IN = { el: null, i: 0, elapsed: 0, last: 0, paused: false, held: false, timers: [], hold: null, cat: 'الكل', touched: false, down: null };
function introSeen() { try { return localStorage.getItem(INTRO_KEY) === '1'; } catch (e) { return false; } }
function markIntro() { try { localStorage.setItem(INTRO_KEY, '1'); } catch (e) {} }
function introLines() {

  const ss = sentences(t); return [ss[4], ss[9], ss[7]].filter(Boolean);
}

function clearIntroTimers() { IN.timers.forEach(t => { clearTimeout(t); clearInterval(t); }); IN.timers = []; }
function goScene(i) {
  if (!IN.el) return;
  i = Math.max(0, Math.min(INTRO_DUR.length - 1, i));
  clearIntroTimers(); IN.i = i; IN.elapsed = 0;
  $$('.scene', IN.el).forEach((sc, k) => { sc.classList.remove('on'); sc.setAttribute('aria-hidden', String(k !== i)); if (k === i) { void sc.offsetWidth; sc.classList.add('on'); } });
  $$('.i-bars b', IN.el).forEach((b, k) => { b.style.width = k < i ? '100%' : '0%'; });
  $('[data-i=prev]', IN.el).style.visibility = i === 0 ? 'hidden' : '';
  $('[data-i=next]', IN.el).style.visibility = i === INTRO_DUR.length - 1 ? 'hidden' : '';
  const rm = reduceMotion(); const last = i === INTRO_DUR.length - 1;
  $('#iHint').textContent = last ? '' : (rm ? 'استخدم الأسهم للتنقل' : 'اضغط يسارًا للتالي · مطوّلًا للإيقاف');
  const h = $('.scene.on h2', IN.el) || $('.scene.on p', IN.el); if (h) announce(h.textContent);
  if (i === 1) typeScene(rm);
  if (i === 2) {
    IN.touched = false; const pop = $('.i-pop', IN.el); pop.classList.remove('show');
    $$('.i-s', IN.el).forEach(x => x.classList.toggle('hit', isLiked(x.dataset.sid)));
    IN.timers.push(setTimeout(() => { if (!IN.touched && !$('.i-s.hit', IN.el)) { const m = $$('.i-s', IN.el)[1]; m && m.classList.add('hit', 'ghost'); showPop(me() ? 'اضغط على جملة لتحتفظ بها' : 'جرّب: اضغط على جملة'); } }, rm ? 0 : 2600));
  }
  if (last && kbNav) IN.timers.push(setTimeout(() => { const g = $('.i-go', IN.el); g && g.focus({ preventScroll: true }); }, 350));
}
function typeScene(rm) {
  const full = 'كانت جدتي تفتح نافذة المطبخ قبل أن تشعل النار، كأنها تستأذن الصباح. تقول إن البيت الذي لا يتنفس ينسى أصحابه.';
  const el = $('#iTyped'), cnt = $('#iCount'), bar = $('#iBar'); const target = 742;
  let k = rm ? full.length : 0;
  const draw = () => { el.textContent = full.slice(0, k); const pr = k / full.length; cnt.textContent = ar(Math.round(target * pr)); bar.style.width = (target * pr / 10) + '%'; };
  draw(); if (rm) return;
  const id = setInterval(() => { if (IN.paused) return; k = Math.min(full.length, k + 1); draw(); if (k >= full.length) clearInterval(id); }, 36);
  IN.timers.push(id);
}
function showPop(txt) { const pop = $('.i-pop', IN.el); $('span', pop).textContent = txt; pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show'); }
function introLine(sp) {
  IN.touched = true; $$('.i-s.ghost', IN.el).forEach(x => x.classList.remove('hit', 'ghost'));
  if (!me()) { sp.classList.add('hit'); showPop('سجّل دخولك لاحقًا لتحتفظ بها'); return; }
  const on = !isLiked(sp.dataset.sid); setLike(sp.dataset.sid, on); sp.classList.toggle('hit', on);
  showPop(on ? 'صارت ضمن مقتبساتك' : 'أُزيلت من مقتبساتك');
  IN.elapsed = Math.min(IN.elapsed, INTRO_DUR[2] - 3200);
}
function setIntroPause(p) {
  IN.paused = p; if (!IN.el) return; IN.el.classList.toggle('paused', p);
  const b = $('.i-pause', IN.el); b.innerHTML = ic(p ? 'play' : 'pause', 18); b.setAttribute('aria-label', p ? 'متابعة' : 'إيقاف مؤقت');
}
function introTick(ts) {
  if (!IN.el) return;
  const dt = IN.last ? Math.min(100, ts - IN.last) : 0; IN.last = ts;
  const D = INTRO_DUR[IN.i];
  if (!IN.paused && !reduceMotion()) IN.elapsed += dt;
  const b = $$('.i-bars b', IN.el)[IN.i];
  if (b) b.style.width = isFinite(D) ? (reduceMotion() ? 0 : Math.min(100, IN.elapsed / D * 100)) + '%' : '100%';
  if (isFinite(D) && IN.elapsed >= D) goScene(IN.i + 1);
  IN.raf = requestAnimationFrame(introTick);
}
function openIntro() {
  if (IN.el) return;
  closePop(); closeSheet(); $$('.toast').forEach(t => t.remove());
  const w = document.createElement('div'); w.innerHTML = introHtml(); IN.el = w.firstElementChild; document.body.appendChild(IN.el);
  document.documentElement.classList.add('intro-open'); $('#app').setAttribute('aria-hidden', 'true'); $('#nav').setAttribute('aria-hidden', 'true');
  IN.paused = false; IN.last = 0; IN.cat = 'الكل'; IN.el.classList.remove('paused');
  IN.el.addEventListener('click', introClick);
  const stage = $('.i-stage', IN.el);
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button,.i-s,.i-chips')) return;
    IN.down = { x: e.clientX }; IN.held = false;
    IN.hold = setTimeout(() => { IN.held = true; setIntroPause(true); }, 240);
  });
  stage.addEventListener('pointerup', e => {
    clearTimeout(IN.hold); if (!IN.down) return; const d = IN.down; IN.down = null;
    if (IN.held) { IN.held = false; setIntroPause(false); return; }
    const r = stage.getBoundingClientRect();
    if (d.x < r.left + r.width / 2) goScene(IN.i + 1); else goScene(IN.i - 1);
  });
  stage.addEventListener('pointercancel', () => { clearTimeout(IN.hold); if (IN.held) setIntroPause(false); IN.held = false; IN.down = null; });
  goScene(0); IN.raf = requestAnimationFrame(introTick);
  setTimeout(() => { if (!IN.el) return; if (kbNav) $('.i-skip', IN.el).focus({ preventScroll: true }); else { IN.el.setAttribute('tabindex', '-1'); IN.el.focus({ preventScroll: true }); } }, 50);
}
function introClick(e) {
  const sp = e.target.closest('.i-s'); if (sp) { introLine(sp); return; }
  const a = e.target.closest('[data-i]'); if (!a) return;
  switch (a.dataset.i) {
    case 'skip': closeIntro(); break;
    case 'go': closeIntro(); break;
    case 'pause': setIntroPause(!IN.paused); break;
    case 'next': goScene(IN.i + 1); break;
    case 'prev': goScene(IN.i - 1); break;
    case 'cat': IN.cat = a.dataset.v; $$('[data-i=cat]', IN.el).forEach(c => c.setAttribute('aria-pressed', String(c === a))); break;
  }
}
function closeIntro() {
  if (!IN.el) return;
  markIntro(); cancelAnimationFrame(IN.raf); clearIntroTimers();
  const el = IN.el; IN.el = null; el.classList.add('out');
  setTimeout(() => el.remove(), reduceMotion() ? 0 : 450);
  document.documentElement.classList.remove('intro-open'); $('#app').removeAttribute('aria-hidden'); $('#nav').removeAttribute('aria-hidden');
  ui.homeCat = IN.cat; hist.length = 0; view = { name: 'home', p: {} }; render(true);
  if (IN.cat !== 'الكل') toast('نبدأ بـ«' + IN.cat + '». غيّرها متى شئت');
}
document.addEventListener('keydown', e => {
  if (!IN.el) return;
  const k = e.key;
  if (k === 'Escape') { e.preventDefault(); closeIntro(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); goScene(IN.i + 1); }
  else if (k === 'ArrowRight') { e.preventDefault(); goScene(IN.i - 1); }
  else if (k === ' ' && !e.target.closest('button,.i-s')) { e.preventDefault(); setIntroPause(!IN.paused); }
  else if ((k === 'Enter' || k === ' ') && e.target.classList.contains('i-s')) { e.preventDefault(); introLine(e.target); }
  else if (k === 'Tab') {
    const f = $$('button,[tabindex="0"]', IN.el).filter(x => x.offsetParent !== null && x.style.visibility !== 'hidden' && !x.closest('.scene:not(.on)'));
    if (f.length) { const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    return;
  } else return;
  e.stopImmediatePropagation();
}, true);
document.addEventListener('visibilitychange', () => { if (IN.el && document.hidden) setIntroPause(true); });

render(true);
if (!introSeen()) openIntro();
</script>
